# EKS Auto Mode: nodos en la subred privada (salida por NAT).
# La cuenta tiene VPC Block Public Access (block-ingress): los nodos de las subredes
# públicas por defecto no pueden salir a internet (p. ej. para bajar la imagen de GHCR).
apiVersion: eks.amazonaws.com/v1
kind: NodeClass
metadata:
  name: demo-private
spec:
  role: EKSWorkerNodeRole
  subnetSelectorTerms:
    - id: subnet-005543b8343e8cc2b
  securityGroupSelectorTerms:
    - id: sg-0e0a77cdfc9553c50
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: demo-private
spec:
  template:
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: demo-private
      requirements:
        - { key: karpenter.sh/capacity-type, operator: In, values: ["on-demand"] }
        - { key: eks.amazonaws.com/instance-category, operator: In, values: ["t", "c", "m"] }
        - { key: kubernetes.io/arch, operator: In, values: ["amd64"] }
  limits:
    cpu: "4"
